[project]
name = "spendetector"
version = "0.1.0"
description = "Snap a receipt, see what your bank can't: your real itemized spending, in Notion."
requires-python = ">=3.11"
dependencies = [
  "modal>=0.64",
  "openai>=1.40",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
markers = [
  "integration: hits real external services, needs credentials (deselected by default)",
]
addopts = "-m 'not integration'"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # test data rows are intentionally wide
